<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feelflix - Accueil</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <a href="/" style="color: inherit; text-decoration: none;">🎬 Feelflix</a>
        </div>
        <div class="nav-links">
            <a href="/">Accueil</a>
            <a href="#">Un voyage cinématographique</a>
            <a href="quiz.html">Quiz</a>
            <a href="#">Mon profil</a>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h1 class="card-title">🎬 Feelflix Mood Slider</h1>
            <p class="card-subtitle">Comment vous sentez-vous ?</p>

            <div class="slider-wrapper">
                <input id="moodSlider" class="mood-slider" type="range" min="0" max="100" value="0">
            </div>

            <div class="emoji-row" role="group" aria-label="Sélection d'humeur">
                <button type="button" class="emoji-btn" data-value="5" title="Très triste" aria-pressed="false">😢</button>
                <button class="emoji-btn" data-value="20" title="Peur">😨</button>
                <button class="emoji-btn" data-value="40" title="Énervé">😠</button>
                <button class="emoji-btn" data-value="55" title="Neutre">🙂</button>
                <button class="emoji-btn" data-value="70" title="Heureux">😂</button>
                <button class="emoji-btn" data-value="85" title="Joyeux">😍</button>
                <button class="emoji-btn" data-value="95" title="Amoureux">🥰</button>
            </div>

            <div class="mood-info">
                <div class="mood-value" id="moodValue">0</div>
                <div class="mood-label" id="moodLabel">Très triste</div>
            </div>

            <button id="submitBtn" class="find-movie-btn">Trouver un film</button>
            <div id="filmResults" class="film-results" style="display: none;">
                <div class="carousel" id="moodCarousel" role="region" aria-label="Carrousel de films" style="display: none;">
                    <button class="carousel-control prev" aria-label="Film précédent" id="carouselPrev">
                        <span aria-hidden="true">‹</span>
                    </button>
                    <div class="carousel-track-viewport">
                        <ul class="carousel-track" id="carouselTrack" role="list"></ul>
                    </div>
                    <button class="carousel-control next" aria-label="Film suivant" id="carouselNext">
                        <span aria-hidden="true">›</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        © 2025 Feelflix - Découvrez des films selon votre humeur | <a href="#">A propos</a>
    </footer>
</body>
    <script>
        const moodSlider = document.getElementById('moodSlider');
        const moodValue = document.getElementById('moodValue');
        const moodLabel = document.getElementById('moodLabel');
        const submitBtn = document.getElementById('submitBtn');
        const filmResults = document.getElementById('filmResults');

        function getMoodFromValue(value) {
            value = parseInt(value, 10);
            if (value <= 10) return 'très triste';
            if (value <= 30) return 'peur';
            if (value <= 45) return 'énervé';
            if (value <= 55) return 'neutre';
            if (value <= 70) return 'heureux';
            if (value <= 85) return 'joyeux';
            return 'amoureux';
        }

        function getLabelFromMood(mood) {
            switch (mood) {
                case 'très triste': return 'Très triste';
                case 'peur': return 'Peureux';
                case 'énervé': return 'En colère';
                case 'neutre': return 'Neutre';
                case 'heureux': return 'Heureux';
                case 'joyeux': return 'Joyeux';
                case 'amoureux': return 'Amoureux';
                default: return 'Neutre';
            }
        }

        const emojiButtons = document.querySelectorAll('.emoji-btn');

        function updateActiveEmoji(value) {
            // Find closest emoji data-value
            let closest = null;
            let smallest = Infinity;
            emojiButtons.forEach(btn => {
                const v = parseInt(btn.dataset.value, 10);
                const diff = Math.abs(v - value);
                if (diff < smallest) {
                    smallest = diff;
                    closest = btn;
                }
            });
            if (closest) {
                emojiButtons.forEach(b => { b.classList.remove('active'); b.setAttribute('aria-pressed','false'); });
                closest.classList.add('active');
                closest.setAttribute('aria-pressed','true');
            }
        }

        moodSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            moodValue.textContent = val;
            const mood = getMoodFromValue(val);
            moodLabel.textContent = getLabelFromMood(mood);
            updateActiveEmoji(parseInt(val, 10));
        });

        submitBtn.addEventListener('click', async () => {
            const val = moodSlider.value;
            const mood = getMoodFromValue(val);
            // call API to get films for this mood with limit
            try {
                const resp = await fetch(`/api/films?value=${val}&mood=${encodeURIComponent(mood)}&limit=16`);
                if (!resp.ok) throw new Error('Erreur lors de la récupération des films');
                const films = await resp.json();
                renderFilms(films);
            } catch (error) {
                filmResults.innerHTML = `<div class="error">Erreur: ${error.message}</div>`;
                console.error(error);
            }
        });

        // Emoji buttons interaction
        emojiButtons.forEach(btn => {
            btn.setAttribute('role','button');
            btn.setAttribute('aria-pressed','false');
            btn.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    btn.click();
                }
            });
            btn.addEventListener('click', (e) => {
                const v = parseInt(btn.dataset.value, 10);
                moodSlider.value = v;
                moodSlider.dispatchEvent(new Event('input'));
                // update active class handled by updateActiveEmoji
            });
        });

        // initialize active emoji and mood label on load
        // Initialize UI (also done on DOMContentLoaded as fallback)
        const initialVal = parseInt(moodSlider.value, 10);
        moodValue.textContent = initialVal;
        moodLabel.textContent = getLabelFromMood(getMoodFromValue(initialVal));
        updateActiveEmoji(initialVal);
        document.addEventListener('DOMContentLoaded', () => {
            const val = parseInt(moodSlider.value, 10);
            moodValue.textContent = val;
            moodLabel.textContent = getLabelFromMood(getMoodFromValue(val));
            updateActiveEmoji(val);
        });

        // Carousel state
        let carouselState = {
            currentIndex: 0,
            itemsPerView: 4,
            selectedIndex: -1,
            films: []
        };

        // Initialize carousel on load
        function initCarousel() {
            const carousel = document.getElementById('moodCarousel');
            const track = document.getElementById('carouselTrack');
            const prevBtn = document.getElementById('carouselPrev');
            const nextBtn = document.getElementById('carouselNext');
            
            if (!carousel || !track) return;

            // Update items per view based on screen size
            function updateItemsPerView() {
                const width = window.innerWidth;
                if (width >= 1200) {
                    carouselState.itemsPerView = 4;
                } else if (width >= 768) {
                    carouselState.itemsPerView = 2;
                } else {
                    carouselState.itemsPerView = 1;
                }
                updateCarouselPosition();
            }

            // Update carousel position
            function updateCarouselPosition() {
                if (!track || carouselState.films.length === 0) return;
                const firstItem = track.querySelector('.carousel-item');
                if (!firstItem) return;
                
                const itemWidth = firstItem.offsetWidth;
                const gap = 16;
                const translateX = -(carouselState.currentIndex * (itemWidth + gap));
                track.style.transform = `translateX(${translateX}px)`;
            }

            // Navigate carousel
            function moveCarousel(direction) {
                const totalItems = carouselState.films.length;
                if (totalItems === 0) return;

                if (direction === 'next') {
                    carouselState.currentIndex = (carouselState.currentIndex + 1) % totalItems;
                } else {
                    carouselState.currentIndex = (carouselState.currentIndex - 1 + totalItems) % totalItems;
                }
                updateCarouselPosition();
            }

            // Handle selection
            function handleSelection(index) {
                // Single selection mode
                const items = track.querySelectorAll('.carousel-item');
                items.forEach((item, i) => {
                    if (i === index) {
                        item.classList.toggle('selected');
                        if (item.classList.contains('selected')) {
                            carouselState.selectedIndex = index;
                            item.setAttribute('aria-pressed', 'true');
                        } else {
                            carouselState.selectedIndex = -1;
                            item.setAttribute('aria-pressed', 'false');
                        }
                    } else {
                        item.classList.remove('selected');
                        item.setAttribute('aria-pressed', 'false');
                    }
                });
            }

            // Handle click on poster - redirect if selected
            track.addEventListener('click', (e) => {
                const item = e.target.closest('.carousel-item');
                if (!item) return;
                
                const index = Array.from(track.children).indexOf(item);
                const isSelected = item.classList.contains('selected');
                
                if (isSelected) {
                    // Redirect to movie site
                    const movie = carouselState.films[index];
                    if (movie) {
                        window.open(`https://www.themoviedb.org/search?query=${encodeURIComponent(movie.title)}`, '_blank', 'noopener,noreferrer');
                    }
                } else {
                    handleSelection(index);
                }
            });

            // Button handlers
            if (prevBtn) {
                prevBtn.addEventListener('click', () => moveCarousel('prev'));
            }
            if (nextBtn) {
                nextBtn.addEventListener('click', () => moveCarousel('next'));
            }

            // Keyboard navigation
            carousel.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    moveCarousel('prev');
                } else if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    moveCarousel('next');
                } else if (e.key === 'Enter' || e.key === ' ') {
                    const focused = document.activeElement.closest('.carousel-item');
                    if (focused) {
                        e.preventDefault();
                        const index = Array.from(track.children).indexOf(focused);
                        handleSelection(index);
                    }
                }
            });

            // Touch/swipe support
            let touchStartX = 0;
            let touchEndX = 0;

            carousel.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });

            carousel.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, { passive: true });

            function handleSwipe() {
                const swipeThreshold = 50;
                const diff = touchStartX - touchEndX;
                
                if (Math.abs(diff) > swipeThreshold) {
                    if (diff > 0) {
                        moveCarousel('next');
                    } else {
                        moveCarousel('prev');
                    }
                }
            }

            // Window resize handler
            window.addEventListener('resize', () => {
                updateItemsPerView();
            });

            // Expose update function
            window.updateCarouselPosition = updateCarouselPosition;
            window.updateItemsPerView = updateItemsPerView;
        }

        function renderFilms(films) {
            const carousel = document.getElementById('moodCarousel');
            const track = document.getElementById('carouselTrack');
            
            if (!films || films.length === 0) {
                filmResults.style.display = 'block';
                if (carousel) carousel.style.display = 'none';
                filmResults.innerHTML = '<p class="no-films">Aucun film trouvé pour cette humeur.</p>';
                return;
            }

            carouselState.films = films;
            carouselState.currentIndex = 0;
            carouselState.selectedIndex = -1;

            if (!track) return;

            // Show carousel and results
            filmResults.style.display = 'block';
            if (carousel) carousel.style.display = 'block';

            // Clear previous items
            track.innerHTML = '';

            // Create carousel items
            films.forEach((movie, index) => {
                const li = document.createElement('li');
                li.className = 'carousel-item';
                li.setAttribute('role', 'listitem');
                li.setAttribute('tabindex', '0');
                li.setAttribute('aria-pressed', 'false');
                li.setAttribute('aria-label', `${movie.title}, ${movie.genre}, Note: ${movie.rating}`);
                
                li.innerHTML = `
                    <div class="poster-wrapper">
                        <img loading="lazy" src="${movie.poster_url}" alt="${movie.title}" class="poster-image">
                        <div class="poster-overlay">
                            <h3 class="poster-title">${movie.title}</h3>
                            <div class="poster-info">
                                <span class="poster-rating">⭐ ${movie.rating}</span>
                                <span class="poster-genre">${movie.genre}</span>
                            </div>
                        </div>
                        <div class="selection-indicator">
                            <span class="check-icon">✓</span>
                        </div>
                    </div>
                `;
                
                track.appendChild(li);
            });

            // Initialize carousel if not already done
            if (!window.carouselInitialized) {
                initCarousel();
                window.carouselInitialized = true;
            }

            // Update items per view and position after images load
            setTimeout(() => {
                if (window.updateItemsPerView) {
                    window.updateItemsPerView();
                }
                if (window.updateCarouselPosition) {
                    window.updateCarouselPosition();
                }
            }, 100);
        }
    </script>
</html>
